{% include 'admin_head.html' %}


<div class="row">
    <div class="w-30"></div>
    <div class="w-30  mt-100">
        <div class="card mt-100  ">
            <div class="row">
                <div class="w-15 p-10"></div>

                <div class="w-70 p-10">
                    <div class="text-center  mt-20  h5">Add Store</div>
                    <form action="/add_store_action" method="POST">
                        <div class="form-group  mt-25">
                            <input type="text" name="store_name" id="store_name" class="form-control p-10 bg-secondary" placeholder="Enter Store Name" required>
                        </div>
                        <div class="form-group  mt-25">
                            <input type="text" name="location" id="location" class="form-control p-10 bg-secondary" placeholder="Enter Location Name" required>
                        </div>
                        <input type="submit" value="Add Store" class="btn bg-primary text-white p-10 mt-25 w-80">
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="w-10"></div>
</div>
