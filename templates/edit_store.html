{% include 'admin_head.html' %}

<div class="row">
    <div class="w-30"></div>
    <div class="w-30 mt-100">
        <div class="card mt-100">
            <div class="row">
                <div class="w-15 p-10"></div>
                <div class="w-70 p-10">

                    <div class="text-center mt-20 h5">Edit Store</div>

                    <form action="/update_store" method="POST">
                        <input type="hidden" name="store_id" value="{{ store[0] }}">

                        <div class="form-group mt-25">
                            <input type="text" name="store_name" value="{{ store[1] }}"
                                   class="form-control p-10 bg-secondary" required>
                        </div>

                        <div class="form-group mt-25">
                            <input type="text" name="location" value="{{ store[2] }}"
                                   class="form-control p-10 bg-secondary" required>
                        </div>

                        <input type="submit" value="Update Store" class="btn bg-primary text-white p-10 mt-25 w-80">
                    </form>

                </div>
            </div>
        </div>
    </div>
    <div class="w-10"></div>
</div>
