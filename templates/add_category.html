{% include 'admin_head.html' %}

<div class="row">
    <div class="w-10"></div>
    <div class="w-30  mt-100">
        <div class="card mt-100  ">
            <div class="row">
                <div class="w-15 p-10"></div>

                <div class="w-70 p-10">
                    <div class="text-center  mt-20  h5">Add Category</div>
                    <form action="/add_category_action" method="POST">
                        <div class="form-group  mt-25">
                            <input type="text" name="category_name" id="category_name"
                                class="form-control p-10 bg-secondary"
                                placeholder="Enter Category Name" required>
                        </div>
                        <input type="submit" value="Add Category"
                            class="btn bg-primary text-white p-10 mt-25 w-80">
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="w-10"></div>

    <div class="w-40 mt-100 p-10">
        <div class="text-center h4 mt-40">View Categories</div>
        <div class="p-15">

            <table id="mytable" class="table w-100">
                <thead>
                    <tr>
                        <th>Category Name</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody>
                    {% for category in categories %}
                    <tr>
                        <td>{{category[1]}}</td>

                        <td>
                            <a href="/edit_category?category_id={{category[0]}}"
                                class="btn bg-success w-50">Edit</a>
                        </td>

                        <td>
                            <button onclick="deleteCategory('{{category[0]}}')"
                                class="btn bg-danger w-50">Delete</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>
</div>

<script>
function deleteCategory(id) {
    if (confirm("Are you sure you want to delete this category?")) {
        window.location.href = "/delete_category?category_id=" + id;
    }
}
</script>
