{% include 'admin_head.html' %}


<div class="row">
    <div class="w-30"></div>
    <div class="w-30  mt-100">
        <div class="card mt-100  ">
            <div class="row">
                <div class="w-15 p-10"></div>

                <div class="w-70 p-10">
                    <div class="text-center  mt-20  h5">Add Items</div>
                    <form action="/add_items_action" method="POST">
                         <input type="hidden" name="store_id" value="{{store_id}}">

                        <div class="form-group mt-10">
                            <label>SELECT CATEGORY</label>
                            <select name="category_id" class="form-control" required>
                                <option value="">choose category</option>
                                  {% for category in categories %}
                                  <option value="{{category[0]}}">{{category[1]}}</option>
                                  {% endfor %}
                            </select>
                        </div>
                        <div class="form-group  mt-25">
                            <input type="text" name="item_name" id="item_name" class="form-control p-10 bg-secondary" placeholder="Enter Item Name" required>
                        </div>
                        <div class="form-group  mt-25">
                            <input type="number" name="price" id="price" class="form-control p-10 bg-secondary"  required>
                        </div>
                        <input type="submit" value="Add Store" class="btn bg-primary text-white p-10 mt-25 w-80">
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="w-10"></div>
</div>
